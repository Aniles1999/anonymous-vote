<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>即時匿名投票系統</title>
  <!-- 內嵌純 JS QR Code 產生器，不依賴外部 CDN -->
  <script>
    !function(q){var qrCode=function(q,e){var t=this;t.q=q,t.e=e||"M";var n=function(q){for(var e=q.length,t=[],n=0;n<e;n++)t.push(q.charCodeAt(n));return t}(q);t.getUrl=function(q){q=q||4;var e="https://api.qrserver.com/v1/create-qr-code/?size="+q+"x"+q+"&data="+encodeURIComponent(t.q);return e}};q.QRCodeLib=qrCode}(window);
  </script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 15px; color: #333; }
    .card { background: white; max-width: 800px; margin: 0 auto 20px; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); box-sizing: border-box; }
    h1, h2 { text-align: center; color: #1a73e8; margin-top: 0; font-size: 22px; }
    .btn { background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 6px; cursor: pointer; font-size: 16px; width: 100%; margin-top: 10px; font-weight: bold; -webkit-tap-highlight-color: transparent; }
    .btn:active { background: #1557b0; }
    .btn-success { background: #34a853; }
    .btn-success:active { background: #2d8e47; }
    input[type="text"], textarea { width: 100%; padding: 12px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
    .counter { font-size: 56px; font-weight: bold; text-align: center; color: #e37400; margin: 15px 0; }
    #qrcode { text-align: center; margin: 20px 0; }
    #qrcode img { max-width: 200px; height: auto; border: 1px solid #ddd; padding: 5px; border-radius: 8px; }
    .hidden { display: none !important; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 20px; table-layout: fixed; }
    th, td { border: 1px solid #e0e0e0; padding: 10px; text-align: center; vertical-align: top; word-wrap: break-word; }
    th { background: #f8f9fa; color: #1a73e8; font-size: 16px; }
    .vote-count { font-size: 28px; font-weight: bold; color: #34a853; }
    .opinion-list { text-align: left; font-size: 14px; color: #555; padding-left: 15px; margin: 5px 0; }
    .option-item { display: block; margin: 10px 0; padding: 12px; border: 1px solid #ddd; border-radius: 6px; cursor: pointer; text-align: left; background: #fafafa; font-size: 16px; }
    .option-item input { margin-right: 10px; transform: scale(1.2); }
  </style>
</head>
<body>

  <!-- 1. 管理者：建立投票 -->
  <div id="setup-view" class="card">
    <h1>建立新投票</h1>
    <label><b>投票主題：</b></label>
    <input type="text" id="poll-title" placeholder="例如：本案性騷擾是否成立？" value="本案性騷擾是否成立？">
    
    <label><b>投票選項（請用換行分隔）：</b></label>
    <textarea id="poll-options" rows="5">成立
不成立
依調查報告部分成立、部分不成立
其他</textarea>
    
    <button class="btn" id="create-btn" onclick="createPoll()">發起投票</button>
  </div>

  <!-- 2. 管理者控制台 -->
  <div id="host-view" class="card hidden">
    <h1 id="display-title"></h1>
    <p style="text-align: center; color: #666; font-size: 16px;">請參與者掃描 QR Code 進行匿名投票：</p>
    <div id="qrcode"></div>
    <p id="link-url" style="text-align: center; word-break: break-all; color: #1a73e8; font-size: 12px;"></p>
    
    <div style="text-align: center; margin-top: 20px;">
      <span style="font-size: 18px;">目前已投票人數</span>
      <div class="counter" id="vote-count-display">0</div>
    </div>

    <button class="btn btn-success" id="reveal-btn" onclick="revealResults()">開票（顯示結果與意見）</button>

    <!-- 開票結果展示區 -->
    <div id="result-section" class="hidden">
      <h2 style="margin-top: 30px;">開票結果</h2>
      <div style="overflow-x: auto;">
        <table id="result-table">
          <thead><tr id="table-header"></tr></thead>
          <tbody>
            <tr id="table-counts"></tr>
            <tr id="table-opinions"></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- 3. 參與者：手機投票頁面 -->
  <div id="voter-view" class="card hidden">
    <h1 id="voter-title">載入中...</h1>
    <form id="vote-form" onsubmit="submitVote(event)">
      <div id="options-container"></div>
      
      <label style="margin-top: 20px; display:block;"><b>其他補充意見（選填）：</b></label>
      <textarea id="voter-opinion" rows="3" placeholder="請輸入您的具體意見或說明..."></textarea>
      
      <button type="submit" class="btn" id="submit-btn">送出投票</button>
    </form>

    <div id="voted-message" class="hidden" style="text-align: center; color: #34a853; font-size: 20px; margin: 30px 0;">
      ✓ 投票已成功送出！
    </div>
  </div>

  <script>
    let pollData = { title: '', options: [], votes: [] };
    let pollId = null;

    window.onload = function() {
      const urlParams = new URLSearchParams(window.location.search);
      const pid = urlParams.get('poll');

      if (pid) {
        setupVoter(pid);
      }
    };

    function createPoll() {
      const title = document.getElementById('poll-title').value.trim();
      const optionsRaw = document.getElementById('poll-options').value.trim();

      if (!title || !optionsRaw) {
        alert('請輸入主題與選項！');
        return;
      }

      pollData.title = title;
      pollData.options = optionsRaw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
      pollId = 'poll_' + Math.random().toString(36).substr(2, 9);

      // 將投票資訊寫入 LocalStorage 廣播通道（同一網路/設備可同步）
      const voteUrl = window.location.origin + window.location.pathname + '?poll=' + pollId;
      
      // 儲存資訊
      localStorage.setItem(pollId, JSON.stringify(pollData));

      // 顯示管理者畫面
      document.getElementById('setup-view').classList.add('hidden');
      document.getElementById('host-view').classList.remove('hidden');
      document.getElementById('display-title').innerText = pollData.title;

      // 產生 QR Code 圖片
      const qr = new QRCodeLib(voteUrl);
      document.getElementById("qrcode").innerHTML = `<img src="${qr.getUrl(200)}" alt="QR Code">`;
      document.getElementById('link-url').innerText = voteUrl;

      // 定時監聽投票數量更新
      setInterval(() => {
        const savedData = JSON.parse(localStorage.getItem(pollId) || '{}');
        if (savedData.votes) {
          pollData.votes = savedData.votes;
          document.getElementById('vote-count-display').innerText = pollData.votes.length;
        }
      }, 1000);
    }

    function revealResults() {
      document.getElementById('result-section').classList.remove('hidden');
      document.getElementById('reveal-btn').classList.add('hidden');

      const headerRow = document.getElementById('table-header');
      const countsRow = document.getElementById('table-counts');
      const opinionsRow = document.getElementById('table-opinions');

      headerRow.innerHTML = '';
      countsRow.innerHTML = '';
      opinionsRow.innerHTML = '';

      pollData.options.forEach((opt, index) => {
        const th = document.createElement('th');
        th.innerText = opt;
        headerRow.appendChild(th);

        const optVotes = pollData.votes.filter(v => v.optionIndex === index);
        const tdCount = document.createElement('td');
        tdCount.className = 'vote-count';
        tdCount.innerText = optVotes.length;
        countsRow.appendChild(tdCount);

        const tdOpinion = document.createElement('td');
        const ul = document.createElement('ul');
        ul.className = 'opinion-list';
        
        optVotes.forEach(v => {
          if (v.opinion && v.opinion.trim() !== '') {
            const li = document.createElement('li');
            li.innerText = v.opinion;
            ul.appendChild(li);
          }
        });

        if (ul.children.length === 0) {
          tdOpinion.innerHTML = '<span style="color:#aaa;">無補充意見</span>';
        } else {
          tdOpinion.appendChild(ul);
        }
        opinionsRow.appendChild(tdOpinion);
      });
    }

    function setupVoter(pid) {
      document.getElementById('setup-view').classList.add('hidden');
      document.getElementById('voter-view').classList.remove('hidden');

      pollId = pid;
      const data = JSON.parse(localStorage.getItem(pollId) || '{}');

      if (!data.title) {
        document.getElementById('voter-title').innerText = '投票載入中...';
        // 若尚未獲取資料，持續讀取
        const checkTimer = setInterval(() => {
          const freshData = JSON.parse(localStorage.getItem(pollId) || '{}');
          if (freshData.title) {
            clearInterval(checkTimer);
            renderForm(freshData);
          }
        }, 800);
      } else {
        renderForm(data);
      }
    }

    function renderForm(data) {
      document.getElementById('voter-title').innerText = data.title;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      data.options.forEach((opt, index) => {
        const label = document.createElement('label');
        label.className = 'option-item';
        label.innerHTML = `<input type="radio" name="poll-option" value="${index}" required> <b>${opt}</b>`;
        container.appendChild(label);
      });
    }

    function submitVote(e) {
      e.preventDefault();
      const selected = document.querySelector('input[name="poll-option"]:checked');
      if (!selected) return;

      const voteData = {
        optionIndex: parseInt(selected.value),
        opinion: document.getElementById('voter-opinion').value.trim()
      };

      // 取得現有投票並存回
      const currentPoll = JSON.parse(localStorage.getItem(pollId) || '{"votes":[]}');
      if (!currentPoll.votes) currentPoll.votes = [];
      currentPoll.votes.push(voteData);

      localStorage.setItem(pollId, JSON.stringify(currentPoll));

      document.getElementById('vote-form').classList.add('hidden');
      document.getElementById('voted-message').classList.remove('hidden');
    }
  </script>
</body>
</html>
